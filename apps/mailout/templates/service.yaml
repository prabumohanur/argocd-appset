apiVersion: v1
kind: Service
metadata:
  name: {{ template "mailout.fullname" . }}-sts  #Secure token service
  labels:
    {{- include "mailout.labels" . | nindent 4 }}
    app.kubernetes.io/component: mailout
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: smtp
    port: 1025
    protocol: TCP
    targetPort: smtp
  selector:
    {{- include "mailout.matchLabels" . | nindent 4 }}
    app.kubernetes.io/component: mailout
---
apiVersion: v1
kind: Service
metadata:
  annotations:
  {{- with .Values.serviceAnnotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
  name: {{ template "mailout.fullname" . }}-svc
  labels:
    {{- include "mailout.labels" . | nindent 4 }}
    app.kubernetes.io/component: mailout
spec:
  type: ClusterIP
  ports:
  - name: smtp
    port: 1025
    protocol: TCP
    targetPort: smtp
  selector:
    {{- include "mailout.matchLabels" . | nindent 4 }}
    app.kubernetes.io/component: mailout
---
apiVersion: v1
kind: Service
metadata:
  annotations:
  {{- with .Values.serviceAnnotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
  name: {{ template "mailout.fullname" . }}
  labels:
    {{- include "mailout.labels" . | nindent 4 }}
    app.kubernetes.io/component: mailout
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8025
    protocol: TCP
    targetPort: http
  selector:
    {{- include "mailout.matchLabels" . | nindent 4 }}
    app.kubernetes.io/component: mailout